<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
    @layer base {
     :root {
      @apply text-sm;
       line-height: 1.5;
       }
    }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Courier Prime', monospace; }
        .btn-nav {
            font-size: 2.5rem;
            color: #4b5563; 
            transition: color 0.3s;
            cursor: pointer;
            user-select: none;
        }
        .btn-nav:hover { color: black; }
    </style>
</head>

<body class="bg-[url('usertech.jpg')] bg-cover bg-center bg-no-repeat w-full min-h-screen text-black flex flex-col text-center items-center justify-center p-4">

   <div class="bg-gray-100/95 backdrop-blur-xs flex flex-col items-center justify-center h-auto border border-gray-300 p-4 sm:p-6 select-none w-full max-w-[340px] xs:max-w-xs sm:max-w-sm md:max-w-3xl mx-auto shadow-2xl rounded-xs overflow-x-hidden">
    
    <div class="flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4 mb-6 w-full max-w-xl text-center">
        <!-- Título Principal -->
        <h1 class="text-xl sm:text-2xl font-bold text-black tracking-tight">
            Las mejores Universidades
        </h1>
        
        <!-- Botón Auto -->
        <button id="btn-auto" 
                type="button"
                class="px-3 py-1 text-2xl sm:text-3xl text-green-700 hover:text-green-500 transition-colors focus:outline-none cursor-pointer active:scale-95"> ▶ </button>
    </div>

    <!-- CONTENEDOR GENERAL DEL CARRUSEL -->
    <div class="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-6 w-full mx-auto">
        
        <!-- MAPEO: CONTROLES IZQUIERDOS (<< y <) -->
        <div class="flex items-center justify-center gap-3 order-2 md:order-first">
            
            <button id="btn-anterior" 
                    type="button" 
                    class="font-mono text-2xl font-bold text-black hover:text-blue-500 active:text-blue-700 transition-colors focus:outline-none cursor-pointer p-2">
                &lt;&lt;
            </button>
            
            <button id="btn-anterior-simple" 
                    type="button" 
                    class="font-mono text-2xl font-bold text-black hover:text-blue-500 active:text-blue-700 transition-colors focus:outline-none cursor-pointer p-2">
                &lt;
            </button>
        </div>

        <!-- TARJETA CENTRAL DE LA UNIVERSIDAD -->
        <div class="flex flex-col w-full shadow-md order-1">
             <!-- Imagen con alto unificado anti-saltos -->
             <img id="universidad-imagen" src="" alt="Universidad" 
             class="w-full h-44 sm:h-64 md:h-80 object-cover aspect-video border-b border-black">

            <!-- Bloque de Texto Medio (Nombre y Ubicación) -->
            <div class="bg-black p-4 font-mono text-center md:text-left border-b border-gray-900">
                <h2 id="universidad-nombre" class="text-white text-base sm:text-lg font-bold tracking-wider uppercase">Cargando...</h2>
                <p id="universidad-ubicacion" class="text-gray-400 text-xs mt-0.5">Ubicación</p>
            </div>

            <!-- Bloque Inferior Negro (Ficha Técnica) -->
            <div class="bg-black p-4 sm:p-6 font-mono text-white text-[11px] sm:text-xs space-y-2 text-left">
                <p>• Ranking: <span id="universidad-ranking">#0</span></p>
                <p>• Estudiantes: <span id="universidad-estudiantes">0</span></p>
                <p>• Puntaje: <span id="universidad-puntaje">0/100</span></p>
            </div>
        </div>

        <!-- MAPEO: CONTROLES DERECHOS (> y >>) -->
        <div class="flex items-center justify-center gap-3 order-3 md:order-last">
            
            <button id="btn-siguiente-simple" 
                    type="button" 
                    class="font-mono text-2xl font-bold text-black hover:text-blue-500 active:text-blue-700 transition-colors focus:outline-none cursor-pointer p-2">
                &gt;
            </button>
            
            <button id="btn-siguiente" 
                    type="button" 
                    class="font-mono text-2xl font-bold text-black hover:text-blue-500 active:text-blue-700 transition-colors focus:outline-none cursor-pointer p-2">
                &gt;&gt;
            </button>
        </div>
        
    </div>
</div>

    <script src="./js/carrusel.js"></script>
    <script src="./js/datos.js"></script>
    <script src="./js/main.js"></script>
    
</body>
</html>
